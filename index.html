<script>


/* =========================================================
   CREATE MAP
========================================================= */

const map = L.map("map").setView(
  [42.15, -88.30],
  9
);


L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,

    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(map);


/* =========================================================
   DESIGNATED ZIP CODES
========================================================= */

const designatedZIPs = new Set([

  "60010",
  "60011",
  "60012",
  "60013",
  "60014",
  "60021",
  "60033",
  "60034",
  "60038",
  "60039",
  "60042",
  "60050",
  "60051",
  "60055",
  "60067",
  "60072",
  "60074",
  "60078",
  "60094",
  "60095",
  "60097",
  "60098",
  "60102",
  "60107",
  "60110",
  "60118",
  "60120",
  "60121",
  "60122",
  "60123",
  "60136",
  "60142",
  "60156",
  "60157",
  "60159",
  "60168",
  "60169",
  "60170",
  "60172",
  "60173",
  "60179",
  "60180",
  "60192",
  "60193",
  "60194",
  "60195",
  "60196",
  "60296",
  "60297"

]);


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let territoryData = null;

let territoryLayer = null;

let territoryReady = false;

let manualPinMode = false;

let pendingLocation = null;

const pins = [];


/* =========================================================
   LOAD ZIP TERRITORY
========================================================= */

const territoryURL =
  "https://raw.githubusercontent.com/OpenDataDE/State-zip-code-GeoJSON/master/il_illinois_zip_codes_geo.min.json";


fetch(territoryURL)

.then(response => {

  if (!response.ok) {

    throw new Error(
      "Territory data could not be loaded."
    );

  }

  return response.json();

})


.then(data => {

  /*
    Normalize the ZIP property.

    Different datasets sometimes call
    the ZIP field different things.
  */

  const features =
    data.features.filter(
      feature => {

        const zip =
          getFeatureZIP(feature);

        return designatedZIPs.has(zip);

      }
    );


  territoryData = {

    type:
      "FeatureCollection",

    features:
      features

  };


  territoryLayer =
    L.geoJSON(

      territoryData,

      {

        style: {

          color:
            "#0047ab",

          weight:
            2,

          fillColor:
            "#4da6ff",

          fillOpacity:
            .35

        },


        onEachFeature:
        function(feature, layer) {

          const zip =
            getFeatureZIP(feature);


          const town =
            getFeatureTown(feature);


          layer.bindPopup(

            "<strong>" +

            escapeHTML(town) +

            "</strong><br>" +

            "ZIP Code: " +

            zip

          );

        }

      }

    ).addTo(map);


  territoryReady =
    true;


  const count =
    features.length;


  setStatus(

    "✓ Territory loaded.<br>" +

    count +

    " ZIP areas available.",

    "success"

  );


  if (
    territoryLayer.getBounds().isValid()
  ) {

    map.fitBounds(
      territoryLayer.getBounds(),
      {
        padding:
          [30,30]
      }
    );

  }

})


.catch(error => {

  console.error(error);


  setStatus(

    "⚠ Territory boundary data could not be loaded. " +

    "Please refresh the page.",

    "error"

  );

});


/* =========================================================
   GET ZIP FROM GEOJSON FEATURE
========================================================= */

function getFeatureZIP(feature) {

  const p =
    feature.properties || {};


  const fields = [

    "ZCTA5CE10",
    "ZCTA5CE20",
    "GEOID10",
    "GEOID20",
    "ZIP",
    "ZIPCODE",
    "zip",
    "zipcode"

  ];


  for (
    const field of fields
  ) {

    if (
      p[field] !== undefined &&
      p[field] !== null
    ) {

      const value =
        String(
          p[field]
        ).trim();


      /*
        Handle values such as:
        60014
        "60014"
        "060014"
      */

      const match =
        value.match(
          /\d{5}/
        );


      if (match) {

        return match[0];

      }

    }

  }


  return null;

}


/* =========================================================
   GET TOWN NAME
========================================================= */

function getFeatureTown(feature) {

  const p =
    feature.properties || {};


  return (

    p.PO_NAME ||

    p.PLACE ||

    p.CITY ||

    p.city ||

    p.NAME ||

    "Designated Area"

  );

}


/* =========================================================
   THE ONE TERRITORY VALIDATION FUNCTION
=========================================================

   BOTH business search AND manual pinning use this.

========================================================= */

function isInsideTerritory(
  lat,
  lng
) {

  if (
    !territoryReady ||
    !territoryData
  ) {

    return {

      inside:
        false,

      reason:
        "Territory is still loading."

    };

  }


  const point = [
    lng,
    lat
  ];


  for (
    const feature
    of territoryData.features
  ) {

    if (
      geometryContainsPoint(
        feature.geometry,
        point
      )
    ) {

      return {

        inside:
          true,

        zip:
          getFeatureZIP(feature),

        town:
          getFeatureTown(feature)

      };

    }

  }


  return {

    inside:
      false,

    reason:
      "Location is outside the designated territory."

  };

}


/* =========================================================
   GEOMETRY CONTAINS POINT
========================================================= */

function geometryContainsPoint(
  geometry,
  point
) {

  if (!geometry) {

    return false;

  }


  if (
    geometry.type ===
    "Polygon"
  ) {

    return polygonContainsPoint(
      geometry.coordinates,
      point
    );

  }


  if (
    geometry.type ===
    "MultiPolygon"
  ) {

    for (
      const polygon
      of geometry.coordinates
    ) {

      if (
        polygonContainsPoint(
          polygon,
          point
        )
      ) {

        return true;

      }

    }

  }


  return false;

}


/* =========================================================
   POLYGON TEST
========================================================= */

function polygonContainsPoint(
  rings,
  point
) {

  if (
    !rings ||
    rings.length === 0
  ) {

    return false;

  }


  if (
    !ringContainsPoint(
      rings[0],
      point
    )
  ) {

    return false;

  }


  /*
    Account for holes.
  */

  for (
    let i = 1;

    i < rings.length;

    i++
  ) {

    if (
      ringContainsPoint(
        rings[i],
        point
      )
    ) {

      return false;

    }

  }


  return true;

}


/* =========================================================
   RAY CASTING
========================================================= */

function ringContainsPoint(
  ring,
  point
) {

  let inside =
    false;


  const x =
    point[0];

  const y =
    point[1];


  for (
    let i = 0,
    j = ring.length - 1;

    i < ring.length;

    j = i++
  ) {

    const xi =
      ring[i][0];

    const yi =
      ring[i][1];

    const xj =
      ring[j][0];

    const yj =
      ring[j][1];


    const intersect =

      (
        yi > y
      ) !==
      (
        yj > y
      )

      &&

      x <
      (
        xj - xi
      ) *
      (
        y - yi
      ) /
      (
        yj - yi
      ) +
      xi;


    if (intersect) {

      inside =
        !inside;

    }

  }


  return inside;

}


/* =========================================================
   MANUAL PIN MODE
========================================================= */

function startManualPin() {

  if (
    !territoryReady
  ) {

    alert(
      "The territory is still loading. Please wait a moment."
    );

    return;

  }


  manualPinMode =
    !manualPinMode;


  const button =
    document.getElementById(
      "addPinButton"
    );


  if (
    manualPinMode
  ) {

    button.textContent =
      "📍 Click Map to Place Pin";


    button.classList.add(
      "active"
    );


    map.getContainer().style.cursor =
      "crosshair";


    setStatus(

      "Click a location on the map. " +

      "The location must be inside your designated ZIP territory.",

      ""

    );

  }

  else {

    stopManualPinMode();

  }

}


/* =========================================================
   STOP MANUAL MODE
========================================================= */

function stopManualPinMode() {

  manualPinMode =
    false;


  const button =
    document.getElementById(
      "addPinButton"
    );


  button.textContent =
    "📍 Add Pin Manually";


  button.classList.remove(
    "active"
  );


  map.getContainer().style.cursor =
    "";

}


/* =========================================================
   MAP CLICK
========================================================= */

map.on(
  "click",
  function(event) {

    if (
      !manualPinMode
    ) {

      return;

    }


    const lat =
      event.latlng.lat;

    const lng =
      event.latlng.lng;


    /*
      SAME VALIDATION USED BY
      BUSINESS SEARCH.
    */

    const validation =
      isInsideTerritory(
        lat,
        lng
      );


    if (
      !validation.inside
    ) {

      alert(

        "❌ Outside Territory\n\n" +

        "That location is not inside one of your designated ZIP codes."

      );

      return;

    }


    /*
      Valid territory location.
    */

    pendingLocation = {

      lat:
        lat,

      lng:
        lng,

      zip:
        validation.zip,

      town:
        validation.town

    };


    stopManualPinMode();


    openPinForm();

  }
);


/* =========================================================
   BUSINESS SEARCH
========================================================= */

async function searchBusiness() {

  const query =
    document
      .getElementById(
        "searchBox"
      )
      .value
      .trim();


  if (!query) {

    alert(
      "Please enter a business name or address."
    );

    return;

  }


  if (
    !territoryReady
  ) {

    alert(
      "Please wait for the territory to finish loading."
    );

    return;

  }


  const button =
    document.getElementById(
      "searchButton"
    );


  button.disabled =
    true;

  button.textContent =
    "Searching...";


  try {

    /*
      Ask Nominatim for up to 10
      possible matches.
    */

    const url =

      "https://nominatim.openstreetmap.org/search" +

      "?q=" +

      encodeURIComponent(
        query +
        ", Illinois"
      ) +

      "&format=json" +

      "&addressdetails=1" +

      "&limit=10";


    const response =
      await fetch(
        url,
        {
          headers: {
            "Accept":
              "application/json"
          }
        }
      );


    if (!response.ok) {

      throw new Error(
        "Search request failed."
      );

    }


    const results =
      await response.json();


    if (
      results.length === 0
    ) {

      alert(
        "No businesses or addresses were found."
      );

      return;

    }


    /*
      IMPORTANT:

      We do NOT trust the ZIP returned by
      the search service.

      We take its coordinates and run them
      through our territory polygon.
    */

    const validResults =
      results.filter(
        result => {

          const lat =
            parseFloat(
              result.lat
            );

          const lng =
            parseFloat(
              result.lon
            );


          const validation =
            isInsideTerritory(
              lat,
              lng
            );


          return validation.inside;

        }
      );


    if (
      validResults.length === 0
    ) {

      alert(

        "No search results were found inside your designated territory.\n\n" +

        "Try adding a town or ZIP code to your search."

      );

      return;

    }


    showSearchResults(
      validResults
    );

  }

  catch(error) {

    console.error(error);

    alert(

      "There was a problem searching for that business.\n\n" +

      "Please try again."

    );

  }

  finally {

    button.disabled =
      false;

    button.textContent =
      "🔎 Search Business";

  }

}


/* =========================================================
   DISPLAY SEARCH RESULTS
========================================================= */

function showSearchResults(
  results
) {

  const container =
    document.getElementById(
      "searchResults"
    );


  container.innerHTML =
    "";


  container.style.display =
    "block";


  results.forEach(
    result => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "searchResult";


      const name =
        result.name ||
        result.display_name
          .split(",")[0];


      div.innerHTML =

        "<strong>" +

        escapeHTML(name) +

        "</strong>" +

        escapeHTML(
          result.display_name
        );


      div.onclick =
        function() {

          selectBusiness(
            result
          );

        };


      container.appendChild(
        div
      );

    }
  );

}


/* =========================================================
   SELECT BUSINESS
========================================================= */

function selectBusiness(
  result
) {

  const lat =
    parseFloat(
      result.lat
    );

  const lng =
    parseFloat(
      result.lon
    );


  /*
    SAME TERRITORY VALIDATION FUNCTION.
  */

  const validation =
    isInsideTerritory(
      lat,
      lng
    );


  if (
    !validation.inside
  ) {

    alert(
      "This business is outside your designated territory."
    );

    return;

  }


  const name =
    result.name ||
    result.display_name
      .split(",")[0];


  const address =
    result.display_name;


  /*
    Business search automatically creates
    the pin.
  */

  createPin({

    name:
      name,

    address:
      address,

    zip:
      validation.zip,

    town:
      validation.town,

    lat:
      lat,

    lng:
      lng,

    notes:
      ""

  });


  /*
    Hide results.
  */

  document.getElementById(
    "searchResults"
  ).style.display =
    "none";


  document.getElementById(
    "searchBox"
  ).value =
    "";


  map.setView(
    [lat,lng],
    16
  );


  setStatus(

    "✓ " +
    name +
    " added to your saved locations.",

    "success"

  );

}


/* =========================================================
   OPEN MANUAL PIN FORM
========================================================= */

function openPinForm() {

  document.getElementById(
    "pinName"
  ).value =
    "";


  document.getElementById(
    "pinAddress"
  ).value =
    "";


  document.getElementById(
    "pinZip"
  ).value =
    pendingLocation.zip;


  document.getElementById(
    "pinTown"
  ).value =
    pendingLocation.town;


  document.getElementById(
    "pinNotes"
  ).value =
    "";


  document.getElementById(
    "pinForm"
  ).style.display =
    "block";


  document.getElementById(
    "pinName"
  ).focus();

}


/* =========================================================
   SAVE MANUAL PIN
========================================================= */

function saveManualPin() {

  if (
    !pendingLocation
  ) {

    return;

  }


  const name =
    document
      .getElementById(
        "pinName"
      )
      .value
      .trim();


  const address =
    document
      .getElementById(
        "pinAddress"
      )
      .value
      .trim();


  const notes =
    document
      .getElementById(
        "pinNotes"
      )
      .value
      .trim();


  if (!name) {

    alert(
      "Please enter a business or location name."
    );

    return;

  }


  /*
    FINAL TERRITORY CHECK.

    Even though we checked when the map
    was clicked, we check again before
    saving.
  */

  const validation =
    isInsideTerritory(

      pendingLocation.lat,

      pendingLocation.lng

    );


  if (
    !validation.inside
  ) {

    alert(
      "This location is outside your territory."
    );

    cancelPin();

    return;

  }


  createPin({

    name:
      name,

    address:
      address,

    zip:
      validation.zip,

    town:
      validation.town,

    lat:
      pendingLocation.lat,

    lng:
      pendingLocation.lng,

    notes:
      notes

  });


  cancelPin();


  setStatus(

    "✓ Pin saved successfully.",

    "success"

  );

}


/* =========================================================
   CREATE PIN
========================================================= */

function createPin(data) {

  const marker =
    L.marker(

      [
        data.lat,
        data.lng
      ],

      {
        draggable:
          true
      }

    ).addTo(map);


  const pin = {

    id:
      Date.now() +
      Math.random(),

    name:
      data.name,

    address:
      data.address,

    zip:
      data.zip,

    town:
      data.town,

    notes:
      data.notes,

    lat:
      data.lat,

    lng:
      data.lng,

    marker:
      marker

  };


  pins.push(
    pin
  );


  marker.bindPopup(
    createPopup(pin)
  );


  /*
    DRAG VALIDATION.

    Again, this uses the SAME
    isInsideTerritory() function.
  */

  marker.on(
    "dragend",
    function(event) {

      const position =
        event.target.getLatLng();


      const validation =
        isInsideTerritory(

          position.lat,

          position.lng

        );


      if (
        !validation.inside
      ) {

        alert(

          "❌ Pin cannot be moved outside your territory."

        );


        marker.setLatLng(

          [
            pin.lat,

            pin.lng

          ]

        );


        return;

      }


      pin.lat =
        position.lat;

      pin.lng =
        position.lng;

      pin.zip =
        validation.zip;

      pin.town =
        validation.town;


      marker.setPopupContent(
        createPopup(pin)
      );


      updatePinList();

    }
  );


  updatePinList();

}


/* =========================================================
   PIN POPUP
========================================================= */

function createPopup(pin) {

  return `

    <div style="min-width:190px">

      <strong>
        ${escapeHTML(pin.name)}
      </strong>

      <br><br>

      ${escapeHTML(pin.address || "")}

      <br><br>

      <strong>ZIP:</strong>
      ${escapeHTML(pin.zip)}

      <br>

      <strong>Town:</strong>
      ${escapeHTML(pin.town)}

      ${
        pin.notes
          ?
          "<br><br><strong>Notes:</strong><br>" +
          escapeHTML(pin.notes)
          :
          ""
      }

      <br><br>

      <button
        onclick="deletePin('${pin.id}')"
        style="
          background:#c62828;
          color:white;
          border:0;
          padding:6px 10px;
          border-radius:4px;
          cursor:pointer;
        "
      >
        Delete
      </button>

    </div>

  `;

}


/* =========================================================
   UPDATE PIN LIST
========================================================= */

function updatePinList() {

  const container =
    document.getElementById(
      "pinItems"
    );


  if (
    pins.length === 0
  ) {

    container.innerHTML =

      '<div style="padding:12px;color:#777;">' +

      "No saved locations yet."

      +

      "</div>";

    return;

  }


  container.innerHTML =
    "";


  pins.forEach(
    pin => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "pinItem";


      item.innerHTML =

        '<div class="pinItemName">' +

        "📍 " +

        escapeHTML(
          pin.name
        ) +

        "</div>" +

        '<div class="pinItemDetails">' +

        escapeHTML(
          pin.address || ""
        ) +

        "<br>" +

        "<strong>" +

        pin.zip +

        "</strong> — " +

        escapeHTML(
          pin.town
        ) +

        "</div>";


      item.onclick =
        function() {

          map.setView(

            [
              pin.lat,
              pin.lng
            ],

            16

          );


          pin.marker.openPopup();

        };


      container.appendChild(
        item
      );

    }
  );

}


/* =========================================================
   TOGGLE PIN LIST
========================================================= */

function togglePinList() {

  const list =
    document.getElementById(
      "pinList"
    );


  if (
    list.style.display ===
    "block"
  ) {

    list.style.display =
      "none";

  }

  else {

    list.style.display =
      "block";

    updatePinList();

  }

}


/* =========================================================
   DELETE PIN
========================================================= */

function deletePin(id) {

  const index =
    pins.findIndex(
      pin =>
        String(pin.id) ===
        String(id)
    );


  if (
    index === -1
  ) {

    return;

  }


  const pin =
    pins[index];


  if (
    !confirm(
      "Delete " +
      pin.name +
      "?"
    )
  ) {

    return;

  }


  map.removeLayer(
    pin.marker
  );


  pins.splice(
    index,
    1
  );


  updatePinList();

}


/* =========================================================
   CLEAR ALL PINS
========================================================= */

function clearPins() {

  if (
    pins.length === 0
  ) {

    alert(
      "There are no pins to clear."
    );

    return;

  }


  if (
    !confirm(
      "Are you sure you want to remove all pins?"
    )
  ) {

    return;

  }


  pins.forEach(
    pin => {

      map.removeLayer(
        pin.marker
      );

    }
  );


  pins.length =
    0;


  updatePinList();

}


/* =========================================================
   CANCEL PIN
========================================================= */

function cancelPin() {

  document.getElementById(
    "pinForm"
  ).style.display =
    "none";


  pendingLocation =
    null;

}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
  message,
  type
) {

  const status =
    document.getElementById(
      "status"
    );


  status.innerHTML =
    message;


  status.className =
    "";


  if (type) {

    status.classList.add(
      type
    );

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    value || "";


  return div.innerHTML;

}


/* =========================================================
   ENTER KEY SEARCH
========================================================= */

document
  .getElementById(
    "searchBox"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        searchBusiness();

      }

    }
  );


/* =========================================================
   PDF EXPORT
========================================================= */

async function exportPDF() {

  const pdfButton =
    document.getElementById(
      "pdfButton"
    );


  pdfButton.disabled =
    true;

  pdfButton.textContent =
    "Creating PDF...";


  try {

    /*
      Hide interface controls
      temporarily.
    */

    const controls =
      document.getElementById(
        "controls"
      );

    const pinList =
      document.getElementById(
        "pinList"
      );

    const pinForm =
      document.getElementById(
        "pinForm"
      );

    const legend =
      document.getElementById(
        "legend"
      );


    controls.style.display =
      "none";

    pinList.style.display =
      "none";

    pinForm.style.display =
      "none";

    legend.style.display =
      "none";


    /*
      Give Leaflet a moment to
      redraw the map.
    */

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          500
        )
    );


    const canvas =
      await html2canvas(
        document.getElementById(
          "map"
        ),
        {
          useCORS:
            true,

          allowTaint:
            false,

          scale:
            2
        }
      );


    /*
      Restore controls.
    */

    controls.style.display =
      "block";

    legend.style.display =
      "block";


    const image =
      canvas.toDataURL(
        "image/png"
      );


    const {
      jsPDF
    } =
      window.jspdf;


    const pdf =
      new jsPDF(
        "landscape",
        "mm",
        "letter"
      );


    const pageWidth =
      pdf.internal.pageSize.getWidth();


    const pageHeight =
      pdf.internal.pageSize.getHeight();


    pdf.setFontSize(
      16
    );


    pdf.text(
      "Northern Illinois Business Territory",
      10,
      10
    );


    const margin =
      10;


    const maxWidth =
      pageWidth -
      margin * 2;


    const maxHeight =
      pageHeight -
      25;


    const ratio =
      canvas.width /
      canvas.height;


    let width =
      maxWidth;


    let height =
      width /
      ratio;


    if (
      height >
      maxHeight
    ) {

      height =
        maxHeight;

      width =
        height *
        ratio;

    }


    pdf.addImage(

      image,

      "PNG",

      (
        pageWidth -
        width
      ) / 2,

      15,

      width,

      height

    );


    /*
      Add a second page containing
      the saved locations.
    */

    if (
      pins.length > 0
    ) {

      pdf.addPage();


      pdf.setFontSize(
        18
      );


      pdf.text(
        "Saved Locations",
        10,
        15
      );


      let y =
        27;


      pins.forEach(
        (pin, index) => {

          if (
            y > 180
          ) {

            pdf.addPage();

            y =
              20;

          }


          pdf.setFontSize(
            12
          );


          pdf.setFont(
            undefined,
            "bold"
          );


          pdf.text(

            (
              index + 1
            ) +

            ". " +

            pin.name,

            10,
            y

          );


          y += 6;


          pdf.setFont(
            undefined,
            "normal"
          );


          pdf.setFontSize(
            10
          );


          const address =
            pin.address ||
            "";


          const addressLines =
            pdf.splitTextToSize(
              address,
              180
            );


          pdf.text(
            addressLines,
            15,
            y
          );


          y +=
            addressLines.length *
            5;


          pdf.text(

            "ZIP: " +
            pin.zip +
            " — " +
            pin.town,

            15,
            y

          );


          y += 6;


          if (
            pin.notes
          ) {

            const notes =
              pdf.splitTextToSize(

                "Notes: " +
                pin.notes,

                180

              );


            pdf.text(
              notes,
              15,
              y
            );


            y +=
              notes.length *
              5;

          }


          y += 8;

        }
      );

    }


    pdf.save(
      "Northern-Illinois-Territory-Map.pdf"
    );

  }

  catch(error) {

    console.error(error);


    alert(
      "The PDF could not be created."
    );


    /*
      Make sure controls come
      back if something goes wrong.
    */

    document.getElementById(
      "controls"
    ).style.display =
      "block";

    document.getElementById(
      "legend"
    ).style.display =
      "block";

  }

  finally {

    pdfButton.disabled =
      false;

    pdfButton.textContent =
      "🖨️ Export Map / PDF";

  }

}


/* =========================================================
   INITIAL MESSAGE
========================================================= */

setStatus(
  "Loading ZIP-code territory boundaries..."
);

</script>
